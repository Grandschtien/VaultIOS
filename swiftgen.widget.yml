input_dir: .
output_dir: .

strings:
  inputs:
    - VaultWidgetExtension/en.lproj/Localizable.strings
  outputs:
    - templateName: flat-swift5
      output: VaultWidgetExtension/Strings.generated.swift

xcassets:
  inputs:
    - VaultWidgetExtension/Assets.xcassets
  outputs:
    - templateName: swift5
      params:
        enumName: VylokWidgetAssetCatalog
      output: VaultWidgetExtension/Assets.generated.swift
