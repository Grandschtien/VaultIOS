# Goes through onboarding until the login screen is shown.
appId: com.egor.shkarin.Vault
---
- repeat:
    while:
      visible:
        id: onboarding.primaryButton
    times: 10
    commands:
      - tapOn:
          id: onboarding.primaryButton
- extendedWaitUntil:
    visible:
      id: login.signInButton
    timeout: 10000
