# Closes the iOS "Save Password?" sheet that appears after a successful sign-in or registration.
# System UI: no app ids, so it is matched by text.
appId: com.egor.shkarin.Vault
---
- extendedWaitUntil:
    visible: "Save Password\\?"
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible: "Save Password\\?"
    commands:
      - tapOn: "Not Now"
