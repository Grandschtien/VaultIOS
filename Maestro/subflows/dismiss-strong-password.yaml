# Closes the iOS "Use Strong Password?" sheet if the system shows it over a password field.
# System UI: the close button has no app id, only the SF Symbol name `xmark`.
appId: com.egor.shkarin.Vault
---
- runFlow:
    when:
      visible: "Fill Strong Password"
    commands:
      - tapOn:
          id: xmark
      - extendedWaitUntil:
          notVisible: "Fill Strong Password"
          timeout: 5000
